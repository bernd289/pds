overrides:
  nodemailer: '^10'
  better-sqlite3: '^13'
  undici: ^8
  undici_v6: npm:undici@^8
  undici_v7: npm:undici@^8

autoDedupe: true

neverBuiltDependencies: []

minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@atproto/*'
  - '@bsky.app/*'
  - '@atproto-labs/*'
  - '@aws-sdk/*'
  - '@smithy/*'

allowBuilds:
  better-sqlite3: true
  core-js: true
