overrides:
  '@types/node': '^26'
  nodemailer: '^9'
  glob: npm:tinyglobby@latest
  '@opentelemetry/propagator-jaeger': '^2'

neverBuiltDependencies: []

minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@atproto/*'
  - '@bsky.app/*'
  - '@atproto-labs/*'
  - '@aws-sdk/*'
  - '@smithy/*'

allowBuilds:
  better-sqlite3: true
  core-js: true
  protobufjs: true
