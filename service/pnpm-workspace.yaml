overrides:
  '@types/node': '^26'
  nodemailer: '^10'
  glob: npm:tinyglobby@latest

autoDedupe: true

neverBuiltDependencies: []

minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@atproto/*'
  - '@bsky.app/*'
  - '@atproto-labs/*'
  - '@aws-sdk/*'
  - '@smithy/*'

allowBuilds:
  better-sqlite3: true
  core-js: true
  protobufjs: true
